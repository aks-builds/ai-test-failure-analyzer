name: CI

# Verifies the analyzer Python package — installs, runs unit tests.
# Playwright tests live in the companion repo:
#   github.com/aks-builds/playwright-userauth-api-suite

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
    inputs:
      results_url:
        description: "URL to a test-results JSON file (optional — runs analyzer if provided)"
        required: false
        default: ""

permissions:
  contents: read
  issues: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 50

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install package
        run: pip install -e .

      - name: Run unit tests
        run: pytest tests/analyzer -q

      # ── On-demand analysis (workflow_dispatch with results_url) ───────────
      - name: Download external results
        if: inputs.results_url != ''
        run: curl -fsSL "${{ inputs.results_url }}" -o test-results.json

      - name: Analyze provided results
        if: inputs.results_url != ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          analyzer analyze \
            --results test-results.json \
            --non-interactive \
            --format markdown \
            --out analysis.md

      - name: Upload analysis artifact
        if: inputs.results_url != ''
        uses: actions/upload-artifact@v4
        with:
          name: analysis
          path: analysis.md
          if-no-files-found: ignore
          retention-days: 14
